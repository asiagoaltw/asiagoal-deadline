name: Update Deadline

on:
  workflow_dispatch:

  schedule:
    # 每 6 小時一次（UTC 00:17、06:17、12:17、18:17，即台灣 08:17、14:17、20:17、02:17）
    # 刻意避開整點，減少 GitHub 排程擁塞
    - cron: "17 */6 * * *"

concurrency:
  group: update-deadline
  # 不要中途取消正在執行的更新，改成排隊
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python
        env:
          # 選填：若 GitHub 的 IP 被擋，可在 Settings > Secrets 新增 PROXY_URL
          # 沒設定時為空字串，fetch.py 會直接略過代理
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python fetch.py

      - name: Commit JSON Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add products.json deadline.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto update deadline"
            git pull --rebase
            git push
          fi
